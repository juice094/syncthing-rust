# syncthing-rust Relay Server — docker-compose
#
# 启动: docker compose -f deploy/docker-compose.relay.yml up -d
# 日志: docker compose -f deploy/docker-compose.relay.yml logs -f
# 停止: docker compose -f deploy/docker-compose.relay.yml down
#
# 客户端配置: relay://<server-ip>:22067/?id=<device-id>

version: "3.8"

services:
  relay:
    image: syncthing-rust:latest
    container_name: syncthing-relay
    restart: unless-stopped
    command:
      - relay-server
      - --listen
      - "0.0.0.0:22067"
      - --session-port
      - "22068"
    ports:
      - "22067:22067"   # Protocol Mode (TLS + bep-relay ALPN)
      - "22068:22068"   # Session Mode (data forwarding)
    volumes:
      - relay-config:/config   # TLS 证书存储
    networks:
      - relay-net
    healthcheck:
      test: ["CMD", "syncthing", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 可选: nginx 反向代理 (端口 443 → 22067, WebSocket upgrade)
  nginx:
    image: nginx:alpine
    container_name: syncthing-relay-nginx
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./nginx-relay.conf:/etc/nginx/conf.d/default.conf:ro
      - relay-config:/certs:ro
    depends_on:
      - relay
    networks:
      - relay-net
    profiles:
      - nginx   # docker compose --profile nginx up

volumes:
  relay-config:

networks:
  relay-net:
