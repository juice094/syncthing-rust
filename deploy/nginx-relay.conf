# nginx 反向代理 — syncthing-rust Relay Server
#
# 将 443 端口的 TLS WebSocket 流量代理到 relay server 的 22067 端口。
# 同时提供健康检查端点。对外呈现为普通 HTTPS 流量。

server {
    listen 443 ssl http2;
    server_name relay.example.com;

    ssl_certificate     /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

    # 健康检查（无需 relay 协议）
    location /health {
        return 200 '{"status":"ok","component":"relay-nginx"}';
        add_header Content-Type application/json;
    }

    # Relay Protocol — 透明 TCP 代理
    # 注意: nginx stream 模块不支持在 http 块中使用。
    # 对于 relay 协议 (非 HTTP), 直接暴露 22067 端口或使用 HAProxy。
    # 本配置文件仅用于 WebSocket upgrade 场景 (端口复用)。

    location / {
        return 426 '{"error":"upgrade required","protocol":"bep-relay"}';
        add_header Content-Type application/json;
        add_header Upgrade bep-relay;
    }
}

# 如需 stream 代理 (TCP), 在 nginx.conf 主配置中添加:
#
# stream {
#     server {
#         listen 443;
#         proxy_pass 127.0.0.1:22067;
#         proxy_connect_timeout 10s;
#     }
# }
