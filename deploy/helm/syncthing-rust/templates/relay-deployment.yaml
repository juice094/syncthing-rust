{{- if .Values.relay.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-relay
  labels:
    app.kubernetes.io/name: syncthing-rust
    app.kubernetes.io/component: relay
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
spec:
  replicas: {{ .Values.relay.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: syncthing-rust
      app.kubernetes.io/component: relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: syncthing-rust
        app.kubernetes.io/component: relay
    spec:
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: relay
          image: "{{ .Values.relay.image.repository }}:{{ .Values.relay.image.tag }}"
          imagePullPolicy: {{ .Values.relay.image.pullPolicy }}
          command:
            - syncthing
            - relay-server
            - --listen
            - "0.0.0.0:{{ .Values.relay.service.protocolPort }}"
            - --session-port
            - "{{ .Values.relay.service.sessionPort }}"
          ports:
            - name: protocol
              containerPort: {{ .Values.relay.service.protocolPort }}
            - name: session
              containerPort: {{ .Values.relay.service.sessionPort }}
          resources: {{- toYaml .Values.relay.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
          livenessProbe:
            exec:
              command: ["syncthing", "status"]
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["syncthing", "status"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          {{- if .Values.relay.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-relay-config
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-relay
  labels:
    app.kubernetes.io/name: syncthing-rust
    app.kubernetes.io/component: relay
spec:
  type: {{ .Values.relay.service.type }}
  ports:
    - name: protocol
      port: {{ .Values.relay.service.protocolPort }}
      targetPort: protocol
    - name: session
      port: {{ .Values.relay.service.sessionPort }}
      targetPort: session
  selector:
    app.kubernetes.io/name: syncthing-rust
    app.kubernetes.io/component: relay
{{- if .Values.relay.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-relay-config
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.relay.persistence.size }}
{{- end }}
{{- end }}
