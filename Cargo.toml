[workspace]
resolver = "2"

members = [
    "crates/syncthing-core",
    "crates/syncthing-net",
    "crates/syncthing-sync",
    "crates/syncthing-fs",
    "crates/syncthing-db",
    "crates/syncthing-api",
    "crates/syncthing-test-utils",
    "crates/syncthing-versioner",
    "crates/bep-protocol",
    "crates/obsidian-vault-crypto-adapter",
    "cmd/syncthing",
    "cmd/syncthing-mcp-bridge",
    "cmd/syncthing-bench",
    "cmd/syncthing-cli",
    "cmd/syncthing-tray",
]

[workspace.package]
version = "3.0.4"
edition = "2021"

[workspace.dependencies]
# 异步运行时
tokio = { version = "1.35", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
async-trait = "0.1"
futures = "0.3"

# TLS / 安全
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pemfile = "2.0"
ring = "0.17"
ed25519-dalek = "2.1"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.12"
prost-build = "0.12"

# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# 加密 / 哈希
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
base64 = "0.21"

# 工具
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.6", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.5"
dashmap = "5.5"
parking_lot = "0.12"
notify = "8"
tempfile = "3"
socket2 = "0.5"
walkdir = "2"

# 可选传输层
tokio-tungstenite = "0.24"

# 日志切片（T-F3）
tracing-appender = "0.2"

# 并行计算（T-B1 scanner 哈希）
rayon = "1.10"
num_cpus = "1.16"

# 基准测试（T-A1）
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
