[package]
name = "syncthing-cli"
version = "0.2.4"
edition = "2021"
description = "Syncthing command-line utilities: generate-cert, show-id, metrics-flush"
license = "MIT"
publish = false

[[bin]]
name = "syncthing-cli"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
rustls = { workspace = true, features = ["ring"] }
syncthing-net = { path = "../../crates/syncthing-net" }
syncthing-core = { path = "../../crates/syncthing-core" }
