[package]
name = "syncthing"
version = "3.0.0"
edition = "2021"

publish = false

[[bin]]
name = "syncthing"
path = "src/main.rs"

[[bin]]
name = "stress_test"
path = "src/bin/stress_test.rs"

[[bin]]
name = "syncthing-monitor"
path = "src/bin/monitor.rs"

[[bin]]
name = "gen_test_config"
path = "src/bin/gen_test_config.rs"

[dependencies]
syncthing-core = { path = "../../crates/syncthing-core" }
syncthing-net = { path = "../../crates/syncthing-net" }
syncthing-sync = { path = "../../crates/syncthing-sync" }
syncthing-api = { path = "../../crates/syncthing-api" }
bep-protocol = { path = "../../crates/bep-protocol" }
syncthing-test-utils = { path = "../../crates/syncthing-test-utils" }

tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
chrono = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
anyhow = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

ratatui = "0.30"
crossterm = "0.28"
rustls = { workspace = true, features = ["ring"] }
dashmap = { workspace = true }
parking_lot = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

axum = "0.7"
arboard = "3.6.1"
sysinfo = "0.30"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Registry"] }

[features]
default = []
websocket = ["syncthing-net/websocket"]

[dev-dependencies]
serial_test = "3.2"
