[package]
name = "syncthing"
version = "0.2.6"
edition = "2021"

[[bin]]
name = "syncthing"
path = "src/main.rs"

[[bin]]
name = "stress_test"
path = "src/bin/stress_test.rs"

[dependencies]
syncthing-core = { path = "../../crates/syncthing-core" }
syncthing-net = { path = "../../crates/syncthing-net" }
syncthing-sync = { path = "../../crates/syncthing-sync" }
syncthing-api = { path = "../../crates/syncthing-api" }
bep-protocol = { path = "../../crates/bep-protocol" }
syncthing-test-utils = { path = "../../crates/syncthing-test-utils" }

tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
chrono = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
anyhow = "1.0"
bytes = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }

ratatui = "0.30"
crossterm = "0.28"
rustls = { workspace = true, features = ["ring"] }
dashmap = { workspace = true }
parking_lot = { workspace = true }

axum = "0.7"
arboard = "3.6.1"
sysinfo = "0.30"
