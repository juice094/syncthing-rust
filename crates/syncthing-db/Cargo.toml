[package]
name = "syncthing-db"
version = "0.2.0"
edition = "2021"
authors = ["juice094"]
description = "Block and metadata storage for Syncthing Rust"
license = "MIT"


[dependencies]
syncthing-core = { path = "../syncthing-core" }

# 异步
tokio = { workspace = true }
async-trait = { workspace = true }

# Storage
sled = "0.34"

# LRU cache
lru = "0.16.3"

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }



[dev-dependencies]
tokio-test = "0.4"
tempfile = { workspace = true }
futures = "0.3"
