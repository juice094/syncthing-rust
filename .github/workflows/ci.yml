name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "clippy-${{ matrix.os }}"
      - run: cargo clippy --workspace --all-targets -- -D warnings -W clippy::await_holding_lock

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test-${{ matrix.os }}"
      - run: cargo test --workspace
        timeout-minutes: 15

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  file-size:
    name: File Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust source files >600-line soft limit
        run: |
          echo "Checking Rust source files >600 lines..."
          found=$(find crates cmd -name "*.rs" -exec wc -l {} + | awk '$1 > 600 {print $1 " " $2}')
          if [ -n "$found" ]; then
            echo "::warning::Files exceeding 600-line soft limit:"
            echo "$found"
          else
            echo "All files within 600-line limit."
          fi

  bench-smoke:
    name: Bench Smoke Test (T-G2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "bench-smoke"
      - name: Compile all benchmarks
        run: cargo bench --no-run --workspace
        timeout-minutes: 15
      - name: Run benchmarks (short, smoke test only)
        # T-G2: 验证 benches 持续可执行；不做严格回归检测
        # 仅作冒烟测试，输出供人工对照 docs/reports/BASELINE_2026-05-12.md
        run: |
          cargo bench -p syncthing-fs --bench scanner -- \
            --warm-up-time 1 --measurement-time 1 --sample-size 10 \
            --output-format bencher
          cargo bench -p syncthing-sync --bench puller -- \
            --warm-up-time 1 --measurement-time 1 --sample-size 10 \
            --output-format bencher
          cargo bench -p bep-protocol --bench encode_decode -- \
            --warm-up-time 1 --measurement-time 1 --sample-size 10 \
            --output-format bencher
        timeout-minutes: 10
